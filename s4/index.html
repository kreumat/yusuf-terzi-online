<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173b57" />
    <title>School Life Adventure</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="lesson-shell" id="lessonShell">
      <header class="top-bar" aria-label="Öğretmen kontrolleri">
        <button class="icon-button" id="menuButton" type="button" aria-label="Ders menüsünü aç">
          <span aria-hidden="true">☰</span>
          <small>Menü</small>
        </button>
        <div class="lesson-brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <strong>School Life Adventure</strong>
          <span id="sectionLabel">Warm-up</span>
        </div>
        <div class="top-actions">
          <button class="icon-button compact" id="fullscreenButton" type="button" aria-label="Tam ekranı aç veya kapat">
            <span aria-hidden="true">⛶</span>
            <small>Tam ekran</small>
          </button>
        </div>
      </header>

      <main class="stage" id="stage" lang="en" aria-live="polite"></main>

      <footer class="teacher-dock">
        <button class="dock-button secondary" id="backButton" type="button">
          <span aria-hidden="true">←</span>
          Geri
        </button>
        <button class="dock-button primary" id="nextButton" type="button">
          İleri
          <span aria-hidden="true">→</span>
        </button>
      </footer>

      <div class="toast" id="toast" role="status" aria-live="assertive"></div>

      <section class="menu-overlay hidden" id="menuOverlay" aria-label="Ders bölümleri">
        <div class="menu-card">
          <div class="menu-heading">
            <div>
              <p class="eyebrow">Öğretmen menüsü</p>
              <h2>Ders bölümleri</h2>
            </div>
            <button class="close-button" id="closeMenuButton" type="button" aria-label="Menüyü kapat">×</button>
          </div>
          <div class="menu-grid" id="menuGrid"></div>
          <div class="menu-footer">
            <a class="text-link" href="weekday-cards.html" target="_blank" rel="noopener">Gün kartlarını aç / yazdır</a>
            <button class="danger-button" id="resetButton" type="button">Dersi sıfırla</button>
          </div>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Days of the Week Cards</title>
    <style>
      :root { font-family: "Segoe UI", "Trebuchet MS", Arial, sans-serif; color: #17324d; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #e8f4fa; }
      .toolbar { max-width: 1200px; display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 0 auto 20px; padding: 18px 22px; border-radius: 20px; background: white; box-shadow: 0 8px 24px rgba(23,50,77,.14); }
      h1 { margin: 0; font-size: 30px; }
      .toolbar button { min-height: 52px; padding: 10px 22px; border: 0; border-radius: 15px; color: white; background: #1678d1; font-size: 18px; font-weight: 900; cursor: pointer; }
      .cards { max-width: 1200px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin: auto; }
      .card { position: relative; min-height: 330px; display: grid; place-items: center; align-content: center; gap: 22px; padding: 28px; border: 8px solid white; border-radius: 34px; background: var(--color); box-shadow: 0 10px 24px rgba(23,50,77,.16); page-break-inside: avoid; }
      .calendar { width: 130px; height: 112px; display: grid; place-items: center; border: 9px solid #17324d; border-radius: 24px; background: rgba(255,255,255,.72); font-size: 62px; font-weight: 1000; }
      .day { font-size: clamp(48px, 6vw, 82px); font-weight: 1000; line-height: 1; text-align: center; }
      .weekend { position: absolute; top: 18px; right: 18px; padding: 9px 18px; border-radius: 999px; color: white; background: #8c6be8; font-size: 22px; font-weight: 1000; letter-spacing: .08em; }
      .weekend-banner { grid-column: 1 / -1; display: grid; place-items: center; min-height: 100px; border: 7px dashed #8c6be8; border-radius: 28px; color: #5d3fb4; background: #f3ecff; font-size: 56px; font-weight: 1000; letter-spacing: .12em; }
      @page { size: A4 landscape; margin: 10mm; }
      @media print {
        body { padding: 0; background: white; }
        .toolbar { display: none; }
        .cards { max-width: none; grid-template-columns: repeat(2, 1fr); gap: 8mm; }
        .card { min-height: 125mm; border: 3mm solid white; border-radius: 8mm; box-shadow: none; break-inside: avoid; }
        .day { font-size: 25mm; }
        .calendar { width: 38mm; height: 33mm; border-width: 2.5mm; font-size: 17mm; }
        .weekend-banner { min-height: 40mm; font-size: 18mm; break-before: page; }
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div><h1>Days of the Week Cards</h1><p>Print in landscape mode at 100% scale.</p></div>
      <button type="button" onclick="window.print()">Print cards</button>
    </header>
    <main class="cards">
      <article class="card" style="--color:#ffe27b"><div class="calendar">1</div><div class="day">Monday</div></article>
      <article class="card" style="--color:#ffa98a"><div class="calendar">2</div><div class="day">Tuesday</div></article>
      <article class="card" style="--color:#bde782"><div class="calendar">3</div><div class="day">Wednesday</div></article>
      <article class="card" style="--color:#83d8ec"><div class="calendar">4</div><div class="day">Thursday</div></article>
      <article class="card" style="--color:#aeb8ff"><div class="calendar">5</div><div class="day">Friday</div></article>
      <article class="card" style="--color:#d9b5f6"><span class="weekend">WEEKEND</span><div class="calendar">6</div><div class="day">Saturday</div></article>
      <article class="card" style="--color:#ffb9d1"><span class="weekend">WEEKEND</span><div class="calendar">7</div><div class="day">Sunday</div></article>
      <div class="weekend-banner">WEEKEND</div>
    </main>
  </body>
</html>

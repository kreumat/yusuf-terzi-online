<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUUELTS - Language Selection</title>
    <meta name="description" content="Select your language to access the BUÜ English Language Teaching Society website.">
	  <link rel="icon" type="image/png" href="images/placeholderlogo.png">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset and Base Styles */
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        :root {
          /* Color Palette - Soft academic tones */
          --primary: #4b6584;      /* Deep blue */
          --secondary: #778ca3;    /* Muted blue-gray */
          --accent: #f7b731;       /* Warm yellow accent */
          --light: #f5f6fa;        /* Off-white background */
          --text: #2f3542;         /* Dark gray text */
          --text-light: #57606f;   /* Light gray text */
          --success: #20bf6b;      /* Green */
          --card-bg: #ffffff;      /* Card background */
          --shadow: rgba(0, 0, 0, 0.1);  /* Subtle shadow */
          
          /* Typography */
          --heading-font: 'Playfair Display', serif;
          --title-font: 'Montserrat', sans-serif;
          --body-font: 'Open Sans', 'Segoe UI', sans-serif;
        }

        body {
            font-family: var(--body-font);
            background-color: var(--light);
            background-image: radial-gradient(rgba(0, 0, 0, 0.02) 2px, transparent 2px);
            background-size: 30px 30px;
            color: var(--text);
            line-height: 1.6;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        /* Main Content Wrapper */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 2rem 1rem;
        }
        
        /* Title Section */
        .title-section {
            width: 100%;
            max-width: 900px;
            margin-bottom: 3rem;
            padding: 0 1rem;
            display: flex;
            justify-content: center;
        }
        
        .title-container {
            position: relative;
            text-align: center;
            display: inline-block;
            max-width: 700px;
        }
        
        .title-section h1 {
            font-family: var(--title-font);
            font-size: 3.2rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 0rem;
            color: var(--primary);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.08);
            letter-spacing: 2px;
            position: relative;
            padding-bottom: 1.5rem;
            text-transform: uppercase;
            text-align: center;
        }
        
        .title-section h1 span {
            display: block;
            margin-top: 0.5rem;
            font-size: 2.8rem;
            letter-spacing: 1.5px;
        }
        
        /* Removed colored accent bar */
        
        /* Language Selection Container */
        .language-container {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.12), 0 10px 20px rgba(0,0,0,0.08);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 650px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 1;
        }
        
        /* Removed colored gradient border */
        
        .language-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
        }

        .language-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            padding: 1.5rem;
            border-radius: 16px;
            transition: all 0.4s ease;
            width: 150px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.03);
            background-color: rgba(255,255,255,0.7);
        }

        .language-option:hover {
            background-color: rgba(255, 255, 255, 0.95);
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            border-color: rgba(0,0,0,0.08);
        }

        .language-option img {
            width: 80px;
            height: auto;
            margin-bottom: 1rem;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }
        
        .language-option:hover img {
            transform: scale(1.05);
        }

        .language-option span {
            font-weight: 700;
            color: var(--text);
            font-size: 1.2rem;
            margin-top: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .language-option:hover span {
            color: var(--primary);
        }

        /* Scrolling Text Animation */
        .scrolling-text-container {
            width: 100%;
            overflow: hidden;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            padding: 14px 0;
            position: relative;
            margin-top: 2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            border: 2px solid rgba(255, 255, 255, 0.6);
            outline: 1px solid var(--accent);
            outline-offset: -1px;
            z-index: 100;
            white-space: nowrap;
            left: 0;
            right: 0;
        }
        
        .scrolling-text {
            white-space: nowrap;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            display: inline-block;
            position: relative;
            animation: continuousScroll 20s linear infinite;
        }
        
        @keyframes continuousScroll {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100vw);
            }
        }
        
        /* Footer Logo */
        .footer-logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 1rem;
            padding: 1rem;
        }
        
        .footer-logo {
            height: 100px;
            width: auto;
            transition: transform 0.3s ease;
        }
        
        .footer-logo:hover {
            transform: scale(1.05);
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .title-section h1 {
                font-size: 2.8rem;
            }
            
            .title-section h1 span {
                font-size: 2.4rem;
            }
            
            .footer-logo {
                height: 80px;
            }
            
            .language-container {
                padding: 2rem 1.5rem;
            }
            
            .language-option {
                width: 130px;
                padding: 1.2rem;
            }
            
            .language-option img {
                width: 70px;
            }
            
            .content-wrapper {
                padding: 1.5rem 1rem;
            }
        }
        
        @media (max-width: 600px) {
            .title-container {
                padding-left: 0;
            }
            
            .footer-logo {
                height: 80px;
            }
            
            .title-section h1 {
                font-size: 2.4rem;
                padding-bottom: 1.2rem;
                text-align: center;
            }
            
            .title-section h1 span {
                font-size: 2rem;
                margin-top: 0.3rem;
            }
            
            .language-options {
                flex-direction: column;
                gap: 1.2rem;
                align-items: center;
            }
            
            .language-option {
                width: 200px;
                padding: 1.2rem;
                min-height: auto;
                display: flex;
                flex-direction: row;
                justify-content: flex-start;
                align-items: center;
                text-align: left;
            }
            
            .language-option img {
                width: 60px;
                margin-bottom: 0;
                margin-right: 1.5rem;
            }
            
            .language-option span {
                font-size: 1.1rem;
            }
            
            .scrolling-text {
                font-size: 1rem;
                animation-duration: 15s;
            }
            
            .language-container {
                padding: 1.8rem 1.5rem;
                max-width: 300px;
            }
            
            .scrolling-text-container {
                padding: 12px 0;
            }
            
            .content-wrapper {
                padding: 1.5rem 1rem;
            }
        }
        
        @media (max-width: 400px) {
            .title-section h1 {
                font-size: 1.6rem;
                padding-bottom: 1rem;
            }
            
            .footer-logo {
                height: 60px;
            }
            
            .language-option {
                width: 180px;
                padding: 1rem;
            }
            
            .language-option img {
                width: 50px;
                margin-right: 1.2rem;
            }
            
            .language-container {
                padding: 1.5rem 1rem;
            }
            
            .content-wrapper {
                padding: 1rem 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="title-section">
            <div class="title-container">
                <h1>BURSA ULUDAĞ UNIVERSITY <span>ENGLISH LANGUAGE TEACHING SOCIETY</span></h1>
            </div>
        </div>
        
        <div class="language-container">
            <div class="language-options">
                <a href="tr/ana-sayfa.html" class="language-option">
                    <img src="images/turkishflag.png" alt="Türk Bayrağı">
                    <span>Türkçe</span>
                </a>
                
                <a href="en/main-page.html" class="language-option">
                    <img src="images/britishflag.png" alt="British Flag">
                    <span>English</span>
                </a>
                
                <a href="de/nogerman.html" class="language-option">
                    <img src="images/germanflag.png" alt="Deutsche Flagge">
                    <span>Deutsch</span>
                </a>
            </div>
        </div>
        
        <div class="scrolling-text-container">
            <div class="scrolling-text">
                Lütfen dilinizi seçin • Please choose your language • Bitte wählen Sie Ihre Sprache
            </div>
        </div>
        
        <div class="footer-logo-container">
            <img src="images/placeholderlogo.png" alt="BUUELTS Logo" class="footer-logo">
        </div>
    </div>
</body>
</html>

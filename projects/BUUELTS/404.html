<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | BUUELTS</title>
    <meta name="description" content="The page you requested couldn't be found on the BUÜ English Language Teaching Society website.">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables and Base Styles */
        :root {
            /* Color Palette - Soft academic tones */
            --primary: #4b6584;      /* Deep blue */
            --secondary: #778ca3;    /* Muted blue-gray */
            --accent: #f7b731;       /* Warm yellow accent */
            --light: #f5f6fa;        /* Off-white background */
            --text: #2f3542;         /* Dark gray text */
            --text-light: #57606f;   /* Light gray text */
            --success: #20bf6b;      /* Green */
            --card-bg: #ffffff;      /* Card background */
            --shadow: rgba(0, 0, 0, 0.1);  /* Subtle shadow */
            
            /* Typography */
            --heading-font: 'Georgia', serif;
            --body-font: 'Open Sans', 'Segoe UI', sans-serif;
        }

        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--body-font);
            background-color: var(--light);
            color: var(--text);
            line-height: 1.6;
            font-size: 16px;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--heading-font);
            color: var(--primary);
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        p {
            margin-bottom: 1rem;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        a:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        /* Layout Structure */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* Header */
        header {
            background-color: var(--card-bg);
            box-shadow: 0 2px 5px var(--shadow);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 60px;
            margin-right: 1rem;
        }
        
        /* 404 Page Specific Styles */
        .error-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 200px);
            text-align: center;
            padding: 2rem;
        }

        .error-title {
            font-size: 8rem;
            color: var(--primary);
            margin-bottom: 1rem;
            line-height: 1;
        }

        .error-message {
            font-size: 1.5rem;
            color: var(--text);
            margin-bottom: 2rem;
            max-width: 600px;
        }

        .error-image-container {
            margin: 2rem 0;
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error-image {
            max-width: 100%;
            max-height: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .error-image:hover {
            transform: scale(1.05);
        }

        .home-button {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 1rem;
            text-decoration: none;
        }

        .home-button:hover {
            background-color: var(--accent);
            color: white;
            transform: scale(1.05);
            text-decoration: none;
        }

        /* Animation classes */
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .error-title {
                font-size: 6rem;
            }

            .error-message {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 576px) {
            .error-title {
                font-size: 4rem;
            }

            .error-message {
                font-size: 1rem;
            }

            .error-image-container {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="container header-container">
            <div class="logo">
                <img src="images/placeholderlogo.png" alt="BUUELTS Logo">
            </div>
           
            
            <button class="nav-toggle" id="navToggle">
            </button>
            
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container">
            <div class="error-container">
                <h1 class="error-title">404</h1>
                <p class="error-message">The page you are looking for couldn't be found :(</p>
				<p class="error-message" style="font-size: 0.85rem;">tr: Aradığınız sayfa bulunamadı :(</p>
				<p class="error-message" style="font-size: 0.85rem;">de: Die gesuchte Seite konnte nicht gefunden werden :(</p>
                
                <div class="error-image-container">
                    <img src="images/closedbox.png" alt="Closed Box" class="error-image" id="errorImage">
                </div>
                
                <a href="index.html" class="home-button">Back to Home</a>
            </div>
        </div>
    </main>

    <!-- JavaScript for image switching and responsive navigation -->
    <script>
        // Handle responsive navigation
        document.getElementById('navToggle').addEventListener('click', function() {
            document.getElementById('navMenu').classList.toggle('active');
        });
        
        // Language dropdown functionality
        document.addEventListener('DOMContentLoaded', function() {
            const langSelector = document.getElementById('langSelector');
            const langSelected = document.getElementById('langSelected');
            
            if (langSelected && langSelector) {
                langSelected.addEventListener('click', function() {
                    langSelector.classList.toggle('active');
                });
                
                // Close dropdown when clicking outside
                document.addEventListener('click', function(event) {
                    if (!langSelector.contains(event.target)) {
                        langSelector.classList.remove('active');
                    }
                });
                
                // Optional: Store selected language in localStorage
                const langOptions = document.querySelectorAll('.lang-option');
                langOptions.forEach(option => {
                    option.addEventListener('click', function() {
                        localStorage.setItem('preferredLanguage', this.getAttribute('href'));
                    });
                });
            }
        });

        // Handle image switching with pixel-perfect click detection
        document.addEventListener('DOMContentLoaded', function() {
            const errorImage = document.getElementById('errorImage');
            let isImageChanged = false;
            
            errorImage.addEventListener('click', function(e) {
                if (isImageChanged) return; // Prevent further clicks after changing to cat
                
                // Get click coordinates relative to the image
                const rect = errorImage.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Check if the clicked pixel is non-transparent
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = errorImage.width;
                canvas.height = errorImage.height;
                context.drawImage(errorImage, 0, 0, errorImage.width, errorImage.height);
                
                // Get pixel data at click position
                try {
                    const pixelData = context.getImageData(x, y, 1, 1).data;
                    const alpha = pixelData[3]; // Alpha channel (0-255)
                    
                    // Only proceed if clicking on a non-transparent part (alpha > 0)
                    if (alpha > 0) {
                        // Fade out the current image
                        errorImage.classList.add('fade-out');
                        
                        // After fade out completes, switch the image and fade in
                        setTimeout(function() {
                            errorImage.src = 'images/orangecat.png';
                            errorImage.alt = 'Surprised Cat';
                            errorImage.classList.remove('fade-out');
                            errorImage.classList.add('fade-in');
                            isImageChanged = true;
                        }, 300);
                    }
                } catch (error) {
                    // Fallback in case of CORS or other issues with canvas
                    console.log("Could not analyze image pixels, using fallback click behavior");
                    // Fade out the current image
                    errorImage.classList.add('fade-out');
                    
                    // After fade out completes, switch the image and fade in
                    setTimeout(function() {
                        errorImage.src = 'images/orangecat.png';
                        errorImage.alt = 'Surprised Cat';
                        errorImage.classList.remove('fade-out');
                        errorImage.classList.add('fade-in');
                        isImageChanged = true;
                    }, 300);
                }
            });
        });
    </script>
</body>
</html>

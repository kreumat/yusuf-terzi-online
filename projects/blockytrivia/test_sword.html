<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Sword Tester</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/three.min.js"></script>
    <script src="js/GLTFLoader.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #333;
            color: white;
            font-family: sans-serif;
        }

        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            z-index: 100;
            max-width: 300px;
        }

        .control-group {
            margin-bottom: 10px;
        }

        label {
            display: inline-block;
            width: 80px;
            font-size: 14px;
        }

        input[type=number] {
            width: 60px;
            color: black;
            padding: 2px;
        }

        input[type=range] {
            width: 100%;
            margin-top: 5px;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 10px;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }

        #output {
            margin-top: 20px;
            background: #222;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            user-select: all;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="controls">
        <h2>Transform Controls</h2>

        <div class="control-group">
            <h3>Position</h3>
            <div><label>X:</label><input type="number" id="posX" step="0.1" value="1.0"></div>
            <div><label>Y:</label><input type="number" id="posY" step="0.1" value="-1.2"></div>
            <div><label>Z:</label><input type="number" id="posZ" step="0.1" value="-2.0"></div>
        </div>

        <div class="control-group">
            <h3>Rotation</h3>
            <div><label>X:</label><input type="number" id="rotX" step="0.1" value="2.2"></div>
            <div><label>Y:</label><input type="number" id="rotY" step="0.1" value="0"></div>
            <div><label>Z:</label><input type="number" id="rotZ" step="0.1" value="1.6"></div>
        </div>

        <div class="control-group">
            <h3>Scale</h3>
            <div><label>Uniform:</label><input type="number" id="scale" step="0.1" value="1.5"></div>
        </div>

        <div id="output" title="Click to copy">Values will appear here</div>
    </div>

    <script>
        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333); // Dark grey background

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        scene.add(camera);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);

        // Helpers
        const gridHelper = new THREE.GridHelper(10, 10);
        scene.add(gridHelper);
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);

        // Model
        let swordModel = null;
        let mixer = null;

        const loader = new THREE.GLTFLoader();
        loader.load('3d/ironsword/source/model.gltf', (gltf) => {
            swordModel = gltf.scene;
            // IMPORTANT: Attach to CAMERA to simulate view in game, OR scene if testing world pos.
            // In the game, sword is attached to camera.
            camera.add(swordModel);

            // Initial values from controls
            updateTransform();

            // Handle transparency/culling if needed
            swordModel.traverse((child) => {
                if (child.isMesh) {
                    child.frustumCulled = false;
                }
            });

        }, undefined, (error) => {
            console.error(error);
            alert('Error loading model. Check console.');
        });

        // GUI Handlers
        const inputs = {
            posX: document.getElementById('posX'),
            posY: document.getElementById('posY'),
            posZ: document.getElementById('posZ'),
            rotX: document.getElementById('rotX'),
            rotY: document.getElementById('rotY'),
            rotZ: document.getElementById('rotZ'),
            scale: document.getElementById('scale'),
        };

        const output = document.getElementById('output');

        function updateTransform() {
            if (!swordModel) return;

            const px = parseFloat(inputs.posX.value);
            const py = parseFloat(inputs.posY.value);
            const pz = parseFloat(inputs.posZ.value);

            const rx = parseFloat(inputs.rotX.value);
            const ry = parseFloat(inputs.rotY.value);
            const rz = parseFloat(inputs.rotZ.value);

            const s = parseFloat(inputs.scale.value);

            swordModel.position.set(px, py, pz);
            swordModel.rotation.set(rx, ry, rz);
            swordModel.scale.set(s, s, s);

            // Generate Code Snippet
            output.innerText = `position.set(${px}, ${py}, ${pz});\nrotation.set(${rx}, ${ry}, ${rz});\nscale.set(${s}, ${s}, ${s});`;
        }

        Object.values(inputs).forEach(input => {
            input.addEventListener('input', updateTransform);
        });

        // Copy to clipboard
        output.addEventListener('click', () => {
            navigator.clipboard.writeText(output.innerText);
            const original = output.innerText;
            output.innerText = "Copied!";
            setTimeout(() => output.innerText = original, 1000);
        });

        // Animate
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>

</html>

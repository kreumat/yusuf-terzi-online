<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nothing to see here</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <!-- Internal CSS Styles -->
    <style>
        /* Basic reset and font setup */
        html, body {
            height: 100%; /* Ensure the body can fill the screen */
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb; /* A light gray background, similar to bg-gray-50 */
            color: #374151; /* Default text color, similar to text-gray-700 */
        }

        /* Main container
          - Uses Flexbox to center the content vertically and horizontally.
          - min-height: 100vh: Makes the container at least the full height of the viewport.
          - padding: 2rem: (32px) Applies padding, similar to p-8.
          - box-sizing: Ensures padding doesn't add to the height/width.
        */
        .main-container {
            display: flex;
            flex-direction: column;
            justify-content: center; /* Vertical centering */
            align-items: center;   /* Horizontal centering */
            min-height: 100vh;
            padding: 2rem;
            box-sizing: border-box;
        }

        /* Wrapper for the text content */
        .text-content {
            text-align: center;
        }

        /* Styling for the paragraphs */
        .text-content p {
            font-size: 1.5rem;      /* 24px, similar to text-2xl */
            font-weight: 500;       /* similar to font-medium */
            margin: 0 0 0.75rem 0;  /* 12px bottom margin, similar to mb-3 */
        }

        /* Remove bottom margin from the last paragraph */
        .text-content p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <!-- 
      Main container
      Applies the centering and padding styles defined above.
    -->
    <div class="main-container">
        
        <!-- Text content wrapper -->
        <div class="text-content">
            
            <!-- English -->
            <p>Nothing to see here</p>
            
            <!-- Turkish -->
            <p>Burada görülecek bir şey yok</p>
            
            <!-- German -->
            <p>Hier gibt es nichts zu sehen</p>

        </div>
    </div>

</body>
</html>

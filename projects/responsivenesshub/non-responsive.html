<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Test Arayüzü</title>
    <style>
        /* Sadece Büyük Ekranlar İçin Sabit Boyutlar (Non-Responsive) */
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 50px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #e0e0e0;
        }

        .quiz-container {
            width: 1280px; /* Sabit Genişlik - Responsive değil */
            height: 800px; /* Sabit Yükseklik */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            padding: 60px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 38px;
            margin: 0;
            background: -webkit-linear-gradient(#00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .content-grid {
            display: flex;
            gap: 40px;
            height: 100%;
        }

        .question-section {
            flex: 2;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 40px;
        }

        .question-text {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover {
            background: rgba(0, 198, 255, 0.2);
            border-color: #00c6ff;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 198, 255, 0.2);
        }

        .option-letter {
            background: #0072ff;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .info-panel {
            flex: 1;
            background: linear-gradient(180deg, rgba(0, 114, 255, 0.1) 0%, rgba(0, 198, 255, 0.05) 100%);
            border: 1px solid rgba(0, 198, 255, 0.2);
            border-radius: 15px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .timer {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            color: #00c6ff;
            text-shadow: 0 0 20px rgba(0, 198, 255, 0.5);
        }

        .progress-container {
            margin-top: 30px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
            color: #aaa;
        }

        .progress-bar {
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            width: 33%;
            height: 100%;
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            border-radius: 5px;
        }

        .next-btn {
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            border: none;
            padding: 20px;
            border-radius: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
        }

        .next-btn:hover {
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.6);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="header">
            <h1>Lorem Ipsum Dolor Sit Amet</h1>
        </div>

        <div class="content-grid">
            <div class="question-section">
                <div class="question-text">
                    Soru 1: Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua?
                </div>

                <div class="options">
                    <button class="option-btn">
                        <span class="option-letter">A</span>
                        Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.
                    </button>
                    <button class="option-btn">
                        <span class="option-letter">B</span>
                        Duis aute irure dolor in reprehenderit in voluptate velit esse cillum.
                    </button>
                    <button class="option-btn">
                        <span class="option-letter">C</span>
                        Excepteur sint occaecat cupidatat non proident, sunt in culpa.
                    </button>
                    <button class="option-btn">
                        <span class="option-letter">D</span>
                        Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit.
                    </button>
                </div>
            </div>

            <div class="info-panel">
                <div>
                    <div class="progress-container">
                        <div class="progress-text">
                            <span>İlerleme</span>
                            <span>1 / 10 Soru</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill"></div>
                        </div>
                    </div>
                </div>

                <div>
                    <div style="text-align: center; color: #888; margin-bottom: 10px;">Kalan Süre</div>
                    <div class="timer">14:59</div>
                </div>

                <button class="next-btn">Sonraki Soru ➔</button>
            </div>
        </div>
    </div>

</body>
</html>

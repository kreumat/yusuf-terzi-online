<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Test Arayüzü</title>
    <style>
        /* Genel Ayarlar */
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #e0e0e0;
            box-sizing: border-box;
        }

        * {
            box-sizing: border-box;
        }

        .quiz-container {
            width: 100%;
            max-width: 1280px; /* Sabit genişlik yerine maksimum genişlik */
            min-height: 80vh; /* Yükseklik içeriğe göre esneyebilir */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            padding: 50px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: clamp(28px, 4vw, 38px); /* Responsive font boyutu */
            margin: 0;
            background: -webkit-linear-gradient(#00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .content-grid {
            display: flex;
            gap: 40px;
            flex: 1;
        }

        .question-section {
            flex: 2;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 40px;
        }

        .question-text {
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 600;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); /* Responsive Grid */
            gap: 20px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 25px;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            line-height: 1.4;
        }

        .option-btn:hover {
            background: rgba(0, 198, 255, 0.2);
            border-color: #00c6ff;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 198, 255, 0.2);
        }

        .option-letter {
            background: #0072ff;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .info-panel {
            flex: 1;
            background: linear-gradient(180deg, rgba(0, 114, 255, 0.1) 0%, rgba(0, 198, 255, 0.05) 100%);
            border: 1px solid rgba(0, 198, 255, 0.2);
            border-radius: 15px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 250px;
        }

        .timer {
            font-size: clamp(36px, 5vw, 48px);
            font-weight: bold;
            text-align: center;
            color: #00c6ff;
            text-shadow: 0 0 20px rgba(0, 198, 255, 0.5);
            margin: 20px 0;
        }

        .progress-container {
            margin-bottom: 20px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
            color: #aaa;
        }

        .progress-bar {
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            width: 33%;
            height: 100%;
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            border-radius: 5px;
        }

        .next-btn {
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            border: none;
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            margin-top: auto;
        }

        .next-btn:hover {
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.6);
            transform: scale(1.02);
        }

        /* --- MOBİL UYUMLULUK (MEDIA QUERIES) --- */
        @media (max-width: 1024px) {
            .content-grid {
                flex-direction: column;
            }
            .info-panel {
                flex-direction: row;
                align-items: center;
                gap: 20px;
                padding: 25px;
            }
            .progress-container {
                flex: 1;
                margin: 0;
            }
            .timer-container {
                flex: 1;
            }
            .timer {
                margin: 0;
            }
            .next-btn {
                flex: 1;
                margin-top: 0;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            .quiz-container {
                padding: 25px;
                border-radius: 15px;
            }
            .question-section {
                padding: 25px;
            }
            .info-panel {
                flex-direction: column;
                gap: 20px;
                padding: 25px;
            }
            .progress-container, .timer-container, .next-btn {
                width: 100%;
            }
            .options {
                grid-template-columns: 1fr; /* Mobilde seçenekler tek sütun */
            }
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="header">
            <h1>Lorem Ipsum Dolor Sit Amet</h1>
        </div>

        <div class="content-grid">
            <div class="question-section">
                <div class="question-text">
                    Soru 1: Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua?
                </div>

                <div class="options">
                    <button class="option-btn">
                        <span class="option-letter">A</span>
                        Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.
                    </button>
                    <button class="option-btn">
                        <span class="option-letter">B</span>
                        Duis aute irure dolor in reprehenderit in voluptate velit esse cillum.
                    </button>
                    <button class="option-btn">
                        <span class="option-letter">C</span>
                        Excepteur sint occaecat cupidatat non proident, sunt in culpa.
                    </button>
                    <button class="option-btn">
                        <span class="option-letter">D</span>
                        Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit.
                    </button>
                </div>
            </div>

            <div class="info-panel">
                <div class="progress-container">
                    <div class="progress-text">
                        <span>İlerleme</span>
                        <span>1 / 10 Soru</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                </div>

                <div class="timer-container">
                    <div style="text-align: center; color: #888; margin-bottom: 5px;">Kalan Süre</div>
                    <div class="timer">14:59</div>
                </div>

                <button class="next-btn">Sonraki Soru ➔</button>
            </div>
        </div>
    </div>

</body>
</html>

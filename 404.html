<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı | Yusuf Terzi</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "Arial", "sans-serif"]
                    },
                    boxShadow: {
                        soft: "0 24px 70px rgba(0, 0, 0, 0.28)"
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260527-2">
</head>
<body data-theme="dark" class="site-page min-h-screen overflow-x-hidden bg-[var(--bg-body)] text-[var(--text-main)] antialiased">
    <header class="site-header sticky top-0 z-50 border-b border-[var(--border-color)] bg-[var(--bg-header)] backdrop-blur-xl">
        <div class="site-header-inner mx-auto flex min-h-[72px] w-full max-w-[1180px] items-center justify-between gap-5 px-4">
            <a href="/" aria-label="Yusuf Terzi" class="grid h-11 w-11 place-items-center rounded-lg border border-[var(--border-color)] bg-[var(--bg-surface)] text-sm font-extrabold text-[var(--text-main)] transition hover:border-[var(--accent)]">
                YT
            </a>

            <div class="flex items-center gap-3 max-[520px]:gap-2">
                <div class="language-switcher flex overflow-hidden rounded-lg border border-[var(--border-color)] bg-[var(--bg-surface)]" aria-label="Language">
                    <button type="button" data-language="tr" aria-label="Türkçe" title="Türkçe" class="language-button grid h-11 w-12 place-items-center p-1.5 transition hover:bg-[var(--accent)] max-[520px]:h-9 max-[520px]:w-10">
                        <img src="images/turkishflag.png" alt="" class="language-flag" aria-hidden="true">
                    </button>
                    <button type="button" data-language="en" aria-label="English" title="English" class="language-button grid h-11 w-12 place-items-center border-l border-[var(--border-color)] p-1.5 transition hover:bg-[var(--accent)] max-[520px]:h-9 max-[520px]:w-10">
                        <img src="images/britishflag.png" alt="" class="language-flag" aria-hidden="true">
                    </button>
                    <button type="button" data-language="de" aria-label="Deutsch" title="Deutsch" class="language-button grid h-11 w-12 place-items-center border-l border-[var(--border-color)] p-1.5 transition hover:bg-[var(--accent)] max-[520px]:h-9 max-[520px]:w-10">
                        <img src="images/germanflag.png" alt="" class="language-flag" aria-hidden="true">
                    </button>
                </div>

                <button id="theme-toggle" type="button" data-lang-label="themeToggle" aria-label="Tema değiştir" title="Tema değiştir" class="grid h-11 w-11 place-items-center rounded-lg border border-[var(--border-color)] bg-[var(--bg-surface)] text-[var(--text-secondary)] transition hover:border-[var(--accent)] hover:bg-[var(--accent)] hover:text-white max-[520px]:h-9 max-[520px]:w-9">
                    <i class="fas fa-moon" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="not-found-main px-4 py-12">
        <section class="not-found-shell mx-auto grid w-full max-w-[1180px] items-center" aria-labelledby="not-found-title">
            <div class="not-found-panel">
                <span class="hero-rule" aria-hidden="true"></span>

                <div class="grid gap-8 lg:grid-cols-[0.78fr_1fr] lg:items-end">
                    <p class="not-found-code" aria-hidden="true">404</p>

                    <div class="max-w-[620px]">
                        <p class="section-eyebrow text-xs font-extrabold uppercase text-[var(--accent-green)]" data-lang="notFoundEyebrow">Kayıp rota</p>
                        <h1 id="not-found-title" class="mt-3 text-[clamp(2.1rem,6vw,4.8rem)] font-extrabold leading-[0.98] tracking-normal text-[var(--text-main)]" data-lang="notFoundTitle">
                            Bu sayfa burada değil.
                        </h1>
                        <p class="mt-5 text-lg font-medium leading-relaxed text-[var(--text-secondary)] max-[720px]:text-base" data-lang="notFoundText">
                            Aradığın şey portfolyoda yoksa ya henüz eklenmemiştir ya da tarihin karanlıklarına gömülmüştür.
                        </p>

                        <div class="mt-8 flex flex-wrap gap-3">
                            <a href="/" class="inline-flex items-center gap-3 rounded-lg border border-[var(--accent)] bg-[var(--accent)] px-4 py-3 font-extrabold text-white transition hover:border-[var(--accent-strong)] hover:bg-[var(--accent-strong)]" data-lang="homeLink">
                                <i class="fas fa-arrow-left" aria-hidden="true"></i>
                                Ana sayfaya dön
                            </a>
                            <a href="mailto:yusufxterzi@gmail.com" class="inline-flex items-center gap-3 rounded-lg border border-[var(--border-color)] bg-[var(--bg-surface)] px-4 py-3 font-extrabold text-[var(--text-main)] transition hover:border-[var(--accent)] hover:text-[var(--accent-strong)]" data-lang="contactLink">
                                <i class="fas fa-envelope" aria-hidden="true"></i>
                                Bana ulaş
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="border-t border-[var(--border-color)] px-4 py-6 text-center text-sm text-[var(--text-muted)]">
        <p data-lang="copyright">© 2026 Yusuf Terzi. Tüm hakları saklıdır.</p>
    </footer>

    <script>
        const translations = {
            tr: {
                title: "Sayfa Bulunamadı | Yusuf Terzi",
                themeToggle: "Tema değiştir",
                notFoundEyebrow: "Kayıp rota",
                notFoundTitle: "Bu sayfa burada değil.",
                notFoundText: "Aradığın şey portfolyoda yoksa ya henüz eklenmemiştir ya da tarihin karanlıklarına gömülmüştür.",
                homeLink: "Ana sayfaya dön",
                contactLink: "Bana ulaş",
                copyright: "© 2026 Yusuf Terzi. Tüm hakları saklıdır."
            },
            en: {
                title: "Page Not Found | Yusuf Terzi",
                themeToggle: "Toggle theme",
                notFoundEyebrow: "Lost route",
                notFoundTitle: "This page is not here.",
                notFoundText: "If what you are looking for is not in the portfolio, it is either not added yet or buried in the dark corners of history.",
                homeLink: "Back home",
                contactLink: "Get in touch",
                copyright: "© 2026 Yusuf Terzi. All rights reserved."
            },
            de: {
                title: "Seite nicht gefunden | Yusuf Terzi",
                themeToggle: "Design wechseln",
                notFoundEyebrow: "Verirrte Route",
                notFoundTitle: "Diese Seite gibt es hier nicht.",
                notFoundText: "Wenn das Gesuchte nicht im Portfolio steht, wurde es entweder noch nicht ergänzt oder ist in den dunklen Ecken der Geschichte gelandet.",
                homeLink: "Zur Startseite",
                contactLink: "Kontakt aufnehmen",
                copyright: "© 2026 Yusuf Terzi. Alle Rechte vorbehalten."
            }
        };

        const languageButtons = document.querySelectorAll("[data-language]");
        const themeToggle = document.getElementById("theme-toggle");
        const icon = themeToggle.querySelector("i");

        function applyLanguage(lang) {
            const dictionary = translations[lang] || translations.tr;

            document.documentElement.lang = lang;
            document.title = dictionary.title;

            document.querySelectorAll("[data-lang]").forEach((element) => {
                const key = element.getAttribute("data-lang");
                if (dictionary[key]) {
                    element.textContent = dictionary[key];
                }
            });

            document.querySelectorAll("[data-lang-label]").forEach((element) => {
                const key = element.getAttribute("data-lang-label");
                if (dictionary[key]) {
                    element.setAttribute("aria-label", dictionary[key]);
                    element.setAttribute("title", dictionary[key]);
                }
            });

            languageButtons.forEach((button) => {
                const isActive = button.dataset.language === lang;
                button.classList.toggle("is-active", isActive);
                button.setAttribute("aria-pressed", String(isActive));
            });

            localStorage.setItem("language", lang);
        }

        function updateThemeIcon(theme) {
            icon.classList.toggle("fa-moon", theme !== "light");
            icon.classList.toggle("fa-sun", theme === "light");
        }

        function applyTheme(theme) {
            document.body.setAttribute("data-theme", theme);
            localStorage.setItem("theme", theme);
            updateThemeIcon(theme);
        }

        languageButtons.forEach((button) => {
            button.addEventListener("click", () => applyLanguage(button.dataset.language));
        });

        themeToggle.addEventListener("click", () => {
            const currentTheme = document.body.getAttribute("data-theme") || "dark";
            applyTheme(currentTheme === "dark" ? "light" : "dark");
        });

        applyTheme(localStorage.getItem("theme") || "dark");
        applyLanguage(localStorage.getItem("language") || "tr");
    </script>
</body>
</html>
